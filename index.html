<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>diwash's Linktree</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="./graphics/logo.ico">
  <script data-goatcounter="https://diwash.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body>

  <div class="floating-texts" id="floatingTexts"></div>

  <div class="snap-container" id="snapContainer">

    <div class="hero-section">
      <div class="main-screen">

        <div class="logo-container">
          <div class="logo-placeholder"><img src="./graphics/op.png" alt="logo"></div>
        </div>

        <div class="info-container">
          <h1 class="name">diwash</h1>

          <div class="discord-status-badge" id="discord-status-row">
            <span id="status-dot" class="status-dot offline"></span>
            <div class="discord-status-text">
              <span id="status-text">connecting...</span>
              <span id="discord-activity" class="discord-activity"></span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <section class="stats-section">
      <h2 class="stats-section-title">stats</h2>

      <div class="stats-content">

        <div class="stats-block">
          <h3 class="stats-block-label">github activity</h3>
          <a href="https://github.com/Diwash-7" target="_blank" class="github-heatmap-link">
            <div id="github-heatmap" class="github-heatmap">
              <span class="heatmap-loading">loading activity...</span>
            </div>
          </a>
        </div>

        <div class="stat-badge">
          <span class="stat-icon">⌨</span>
          <div class="stat-badge-text">
            <span id="typing-stat" class="stat-value">loading...</span>
            <span class="stat-label">monkeytype personal best</span>
          </div>
        </div>

        <!-- more stat-badge or stats-block sections can be added here later -->

      </div>
    </section>

  </div>

  <footer class="taskbar">
    <div class="footer-socials">
      <a href="https://discord.com/users/692999678219911209" target="_blank" class="footer-social-link">discord</a>
      <a href="mailto:ytubers80@gmail.com" target="_blank" class="footer-social-link">mail</a>
      <a href="https://github.com/Diwash-7" target="_blank" class="footer-social-link">github</a>
    </div>

    <div class="webring-container">

      <a href="https://hotlinewebring.club/diwash/previous" class="webring-link">
        <img src="./graphics/arrow.png" alt="Previous" class="pixel-icon previous-icon">
      </a>

      <a href="https://hotlinewebring.club/" class="webring-home-link">
        <span class="webring-title">HOTLINE WEBRING</span>
      </a>

      <a href="https://hotlinewebring.club/diwash/next" class="webring-link">
        <img src="./graphics/arrow.png" alt="Next" class="pixel-icon next-icon">
      </a>

    </div>
  </footer>

  <script src="script.js"></script>

</body>

</html>
